    - label: LinkedIn
      url: https://www.linkedin.com/in/alex-martin

# Un ou plusieurs profils de recherche : chacun a sa propre liste d'offres.
# match_mode « domain » garde toutes les offres du métier ; « skills » ne garde que celles
# qui citent au moins min_skills compétences de focus_skills (ou de technologies si vide).
searches:
  - name: DevOps
    roles: [Ingénieur SRE, Ingénieur DevOps, Platform Engineer]
    technologies: [Kubernetes, Docker, Python, Terraform, GitLab CI]
    excluded_keywords: [Stage]
    seniority: mid
    contract_types: [cdi]
    locations: [Paris]
    radius_km: 30
    remote: hybrid
    salary_min: 45000
    max_age_days: 7
    match_mode: domain
  - name: Data Engineer
    roles: [Data Engineer]
    technologies: [Python, SQL, Airflow, Spark, dbt]
    contract_types: [cdi]
    locations: [Paris]
    remote: hybrid
    max_age_days: 7
    match_mode: skills
    focus_skills: [Python, Airflow, dbt]
    min_skills: 2

