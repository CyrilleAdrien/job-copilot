# Profil d'exemple (fictif). Copie ce fichier, remplace les valeurs par les tiennes,
# puis importe-le depuis l'écran Profil. Les dates d'expérience sont au format AAAA-MM.
identity:
  full_name: Alex Martin
  headline: Ingénieur DevOps / SRE
  email: alex.martin@example.com
  phone: "+33 6 00 00 00 00"
  location: Paris / Île-de-France
  availability: Disponible immédiatement
  summary: >-
    Ingénieur diplômé avec 2 ans d'expérience en production et DevOps sur des applications
    critiques. J'automatise les tâches récurrentes en Python et Bash et j'orchestre les chaînes
    CI/CD sur Docker et Kubernetes.
  links:
    - label: GitHub
