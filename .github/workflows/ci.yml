name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Lint et tests Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jobcopilot_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    name: Lint, types, tests et build du front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build et démarrage de la stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          echo "JOBS_DEMO=true" >> .env
          echo "LLM_PROVIDER=demo" >> .env
          echo "MAIL_DEMO=true" >> .env
          echo "CALENDAR_DEMO=true" >> .env
          make secret
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Tous les services répondent
        run: |
          curl -sf http://127.0.0.1:8000/health
          curl -sf -o /dev/null http://127.0.0.1:3000/design
          for i in $(seq 1 12); do
            curl -sf http://127.0.0.1:8000/ready > /dev/null && break
            sleep 5
          done
          curl -s http://127.0.0.1:8000/ready | tee ready.json
          python3 -c "import json; r = json.load(open('ready.json')); assert r['status'] == 'ok', r"
      - name: Le profil d'exemple s'importe puis se relit via la gateway
        run: |
          curl -sf -X POST http://127.0.0.1:8000/api/profile/import \
            -H "content-type: application/yaml" --data-binary @examples/profile.example.yaml > /dev/null
          curl -sf http://127.0.0.1:8000/api/profile/ | python3 -c "import json, sys; assert json.load(sys.stdin)['identity']['full_name'] == 'Alex Martin'"
          curl -sf -o /dev/null http://127.0.0.1:3000/api/profile/
      - name: Les offres de démonstration se collectent et se trient par date
        run: |
          curl -sf -X POST http://127.0.0.1:8000/api/jobs/refresh | tee refresh.json
          python3 -c "import json; r = json.load(open('refresh.json')); assert r['stored'] > 0, r"
          curl -sf http://127.0.0.1:3000/api/jobs/offers > offers.json
          python3 -c "import json; d = [o['published_at'] for o in json.load(open('offers.json'))['items']]; assert d and d == sorted(d, reverse=True), d"
      - name: Un CV et une lettre se génèrent en PDF pour une offre
        run: |
          OFFER=$(python3 -c "import json; print(json.load(open('offers.json'))['items'][0]['id'])")
          curl -sf -X POST http://127.0.0.1:8000/api/documents/generations \
            -H "content-type: application/json" -d "{\"offer_id\": $OFFER}" > generation.json
          ID=$(python3 -c "import json; print(json.load(open('generation.json'))['id'])")
          curl -sf -N --max-time 60 http://127.0.0.1:3000/api/documents/generations/$ID/events | tee events.txt
          grep -q "^event: done" events.txt
          curl -sf http://127.0.0.1:8000/api/documents/generations/$ID > generation.json
          for DOC in $(python3 -c "import json; print(' '.join(d['id'] for d in json.load(open('generation.json'))['documents']))"); do
            curl -sf http://127.0.0.1:8000/api/documents/documents/$DOC/pdf | head -c 4 | grep -q "%PDF"
          done
      - name: La boîte de démonstration se connecte et se lit
        run: |
          curl -sf -X POST http://127.0.0.1:8000/api/mail/accounts \
            -H "content-type: application/json" -d '{"email": "demo@job-copilot.local", "host": "demo"}' > /dev/null
          curl -sf -X POST http://127.0.0.1:8000/api/mail/sync | tee sync.json
          python3 -c "import json; r = json.load(open('sync.json')); assert r['accounts'] == 1 and not r['errors'], r"
          curl -sf http://127.0.0.1:3000/api/mail/accounts | python3 -c "import json, sys; a = json.load(sys.stdin); assert 'password' not in str(a), a"
      - name: Un entretien se crée et s'exporte en .ics
        run: |
          START=$(python3 -c "from datetime import datetime, timedelta, UTC; print((datetime.now(UTC) + timedelta(days=2)).isoformat())")
          END=$(python3 -c "from datetime import datetime, timedelta, UTC; print((datetime.now(UTC) + timedelta(days=2, hours=1)).isoformat())")
          curl -sf -X POST http://127.0.0.1:8000/api/calendar/events -H "content-type: application/json" \
            -d "{\"title\": \"Entretien\", \"starts_at\": \"$START\", \"ends_at\": \"$END\"}" > /dev/null
          curl -sf http://127.0.0.1:3000/api/calendar/feed.ics | tee feed.ics
          grep -q "BEGIN:VEVENT" feed.ics
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
