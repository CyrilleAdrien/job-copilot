name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Lint et tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    name: Lint, types, tests et build du front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build et démarrage de la stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Tous les services répondent
        run: |
          curl -sf http://127.0.0.1:8000/health
          curl -sf -o /dev/null http://127.0.0.1:3000/design
          for i in $(seq 1 12); do
            curl -sf http://127.0.0.1:8000/ready > /dev/null && break
            sleep 5
          done
          curl -s http://127.0.0.1:8000/ready | tee ready.json
          python3 -c "import json; r = json.load(open('ready.json')); assert r['status'] == 'ok', r"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
