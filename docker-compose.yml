name: job-copilot

x-env: &env
  DATABASE_URL: postgresql://${POSTGRES_USER:-jobcopilot}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-jobcopilot}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://s3:8333
  # Sur Mac, Ollama installé nativement utilise le GPU : OLLAMA_URL=http://host.docker.internal:11434
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}

x-service: &service
  build:
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped
  environment: *env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]

services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      API_URL: http://gateway:8000
    depends_on: [gateway]
    networks: [internal]

  gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: gateway }
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    depends_on: [profile, jobs, documents, applications, mail, calendar]
    networks: [internal]

  profile:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: profile } }

  jobs:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: jobs } }
    environment:
      <<: *env
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID:-}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      JOBS_DEMO: ${JOBS_DEMO:-false}

  documents:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: documents } }
    environment:
      <<: *env
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  applications:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: applications } }

  mail:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: mail } }

  calendar:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: calendar } }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobcopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-jobcopilot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  s3:
    # SeaweedFS : stockage open source (Apache 2.0) avec une API compatible S3
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data"]
    volumes:
      - s3-data:/data
    healthcheck:
      # La passerelle S3 n'ouvre son port qu'une fois le filer prêt (15 à 20 s).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  ollama:
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  s3-data:
  ollama-data:
